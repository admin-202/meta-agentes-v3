# fly.toml app configuration file generated for meta-agentes-v3 on 2026-08-03T22:43:32Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'meta-agentes-v3'
primary_region = 'gru'

[build]
  dockerfile = 'Dockerfile'

[deploy]
  strategy = 'immediate'

[env]
  LOG_LEVEL = 'info'
  TZ = 'America/Sao_Paulo'

[[mounts]]
  source = 'claude_state'
  destination = '/home/runner/.claude'
  initial_size = '1GB'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  size = 'shared-cpu-2x'
  memory = '1024mb'
  cpu_kind = 'shared'
  cpus = 2
  memory_mb = 1024
